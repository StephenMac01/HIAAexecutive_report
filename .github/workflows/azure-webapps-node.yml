      - name: Prepare standalone deployment
        run: |
          rm -rf deploy hiaaexecutivereport.zip
          mkdir -p deploy

          cp -a .next/standalone/. deploy/

          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d "public" ]; then
            cp -a public deploy/public
          fi

          rm -f deploy/oryx-manifest.toml
          rm -f deploy/node_modules.tar.gz

          test -f deploy/server.js
          test -f deploy/node_modules/next/package.json

          echo "Deployment root:"
          ls -la deploy

      - name: Create deployment ZIP
        run: |
          cd deploy
          zip -r ../hiaaexecutivereport.zip .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: hiaaexecutivereport.zip
