name: Build and deploy CNS HIAA Dashboard to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hiaaexecutivereport-v2
  NODE_VERSION: "24.x"
  PNPM_VERSION: "11.16.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build

      - name: Prepare standalone deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -a .next/standalone/. deploy/

          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            cp -a public deploy/public
          fi

          rm -rf deploy/node_modules/@swc/helpers
          mkdir -p deploy/node_modules/@swc
          cp -a node_modules/@swc/helpers deploy/node_modules/@swc/helpers

          echo "Verifying standalone server"
          test -f deploy/server.js

          echo "Verifying SWC helper package"
          test -f deploy/node_modules/@swc/helpers/package.json
          test -f deploy/node_modules/@swc/helpers/esm/_interop_require_default.js

          echo "Checking exact SWC helper file"
          ls -la deploy/node_modules/@swc/helpers/esm/_interop_require_default.js

          echo "Deployment package contents"
          ls -la deploy

      - name: Ensure Oryx files are not included
        run: |
          rm -f deploy/oryx-manifest.toml
          rm -f deploy/node_modules.tar.gz

          test ! -f deploy/oryx-manifest.toml
          test ! -f deploy/node_modules.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: none

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
