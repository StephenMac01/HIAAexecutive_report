name: Build and deploy CNS HIAA Dashboard to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hiaaexecutivereport-v2
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.16.0"
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: hiaaexecutivereport-v2-production
  cancel-in-progress: true

jobs:
  build:
    name: Build deployment package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show runtime versions
        shell: bash
        run: |
          set -euxo pipefail

          node --version
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          pnpm install --frozen-lockfile

      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .next deploy node-app.zip

      - name: Build Next.js application
        shell: bash
        run: |
          set -euxo pipefail

          pnpm build

      - name: Verify standalone output
        shell: bash
        run: |
          set -euxo pipefail

          test -d .next/standalone
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/server
          test -d .next/server
          test -d .next/server/chunks
          test -d .next/static
          test -f .next/BUILD_ID

          echo "Standalone Next.js output verified."

      - name: Prepare Azure deployment package
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf deploy node-app.zip
          mkdir -p deploy

          echo "Copying standalone application"
          cp -a .next/standalone/. deploy/

          echo "Copying complete Next.js server output"
          rm -rf deploy/.next/server
          mkdir -p deploy/.next
          cp -a .next/server deploy/.next/server

          echo "Copying Next.js static assets"
          rm -rf deploy/.next/static
          cp -a .next/static deploy/.next/static

          echo "Copying Next.js build metadata"
          cp -a .next/BUILD_ID deploy/.next/BUILD_ID

          for file in \
            app-build-manifest.json \
            build-manifest.json \
            fallback-build-manifest.json \
            prerender-manifest.json \
            react-loadable-manifest.json \
            required-server-files.json \
            routes-manifest.json
          do
            if [ -f ".next/${file}" ]; then
              cp -a ".next/${file}" "deploy/.next/${file}"
            fi
          done

          if [ -d public ]; then
            echo "Copying public assets"
            rm -rf deploy/public
            cp -a public deploy/public
          fi

          echo "Removing stale Azure Oryx files"
          rm -f deploy/oryx-manifest.toml
          rm -f deploy/node_modules.tar.gz
          rm -rf deploy/__oryx_packages__
          rm -rf deploy/_del_node_modules

          echo "Verifying deployment package"
          test -f deploy/server.js
          test -f deploy/.next/BUILD_ID
          test -d deploy/.next/server
          test -d deploy/.next/server/chunks
          test -d deploy/.next/server/chunks/ssr
          test -d deploy/.next/static
          test -f deploy/.next/server/app/_not-found/page.js
          test -f deploy/.next/server/app/_global-error/page.js
          test -f deploy/node_modules/next/package.json
          test -f deploy/node_modules/pg/package.json

          echo "Testing production dependencies"

          (
            cd deploy

            node -e "require('next'); console.log('next loaded successfully')"
            node -e "require('pg'); console.log('pg loaded successfully')"
          )

          echo "Checking the previously missing server chunk"

          PREVIOUS_CHUNK="[root-of-the-server]__00tsl73._.js"
          PREVIOUS_CHUNK_PATH="deploy/.next/server/chunks/ssr/${PREVIOUS_CHUNK}"

          if grep -R \
            --fixed-strings \
            "${PREVIOUS_CHUNK}" \
            deploy/.next/server >/dev/null 2>&1
          then
            if [ ! -f "${PREVIOUS_CHUNK_PATH}" ]; then
              echo "ERROR: Current build references a missing server chunk:"
              echo "${PREVIOUS_CHUNK_PATH}"
              exit 1
            fi

            echo "Previously referenced server chunk is included."
          else
            echo "Current build no longer references the previous chunk name."
          fi

          echo "Testing standalone Next.js server"

          (
            cd deploy

            PORT=8081 HOSTNAME=127.0.0.1 node server.js \
              >standalone-test.log 2>&1 &

            SERVER_PID=$!

            cleanup() {
              kill "${SERVER_PID}" 2>/dev/null || true
            }

            trap cleanup EXIT

            for attempt in $(seq 1 20); do
              STATUS="$(
                curl \
                  --silent \
                  --output standalone-response.txt \
                  --write-out "%{http_code}" \
                  "http://127.0.0.1:8081/" || true
              )"

              if [ -z "${STATUS}" ]; then
                STATUS="000"
              fi

              echo "Standalone test attempt ${attempt}: HTTP ${STATUS}"

              if [ "${STATUS}" -ge 200 ] && \
                 [ "${STATUS}" -lt 500 ]; then
                echo "Standalone server responded successfully."
                exit 0
              fi

              sleep 1
            done

            echo "ERROR: Standalone server did not respond."
            cat standalone-test.log || true
            exit 1
          )

          echo "Creating Azure deployment archive"

          (
            cd deploy
            zip -qr ../node-app.zip .
          )

          echo "Verifying deployment archive"

          test -f node-app.zip

          unzip -Z1 node-app.zip | grep -Fx "server.js"
          unzip -Z1 node-app.zip | grep -Fx ".next/BUILD_ID"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/next/package.json"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/pg/package.json"

          if unzip -Z1 node-app.zip | grep -q "^oryx-manifest.toml$"; then
            echo "ERROR: Oryx manifest unexpectedly included."
            exit 1
          fi

          if unzip -Z1 node-app.zip | grep -q "^node_modules.tar.gz$"; then
            echo "ERROR: Oryx node_modules archive unexpectedly included."
            exit 1
          fi

          echo "Deployment archive is complete."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35

    permissions:
      contents: none

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifact

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euxo pipefail

          test -f artifact/node-app.zip

          unzip -Z1 artifact/node-app.zip | grep -Fx "server.js"
          unzip -Z1 artifact/node-app.zip | grep -Fx ".next/BUILD_ID"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/next/package.json"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/pg/package.json"

          if unzip -Z1 artifact/node-app.zip | grep -q "^oryx-manifest.toml$"; then
            echo "ERROR: Oryx manifest unexpectedly included."
            exit 1
          fi

          if unzip -Z1 artifact/node-app.zip | grep -q "^node_modules.tar.gz$"; then
            echo "ERROR: Oryx node_modules archive unexpectedly included."
            exit 1
          fi

          echo "Downloaded deployment archive verified."

      - name: Read Azure publish-profile credentials
        shell: bash
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          profile_xml = os.environ.get(
              "AZURE_PUBLISH_PROFILE",
              "",
          ).strip()

          if not profile_xml:
              raise SystemExit(
                  "AZURE_WEBAPP_PUBLISH_PROFILE is empty or unavailable."
              )

          try:
              root = ET.fromstring(profile_xml)
          except ET.ParseError as error:
              raise SystemExit(
                  f"AZURE_WEBAPP_PUBLISH_PROFILE is not valid XML: {error}"
              ) from error

          profiles = root.findall(".//publishProfile")

          if not profiles:
              raise SystemExit(
                  "No publishProfile entries were found."
              )

          selected = None

          for profile in profiles:
              method = profile.attrib.get(
                  "publishMethod",
                  "",
              ).lower()

              if method in {"zipdeploy", "msdeploy"}:
                  selected = profile
                  break

          if selected is None:
              selected = profiles[0]

          username = selected.attrib.get("userName", "")
          password = selected.attrib.get("userPWD", "")

          if not username or not password:
              raise SystemExit(
                  "The publish profile does not contain deployment credentials."
              )

          github_env = os.environ["GITHUB_ENV"]

          with open(
              github_env,
              "a",
              encoding="utf-8",
          ) as env_file:
              env_file.write(f"KUDU_USERNAME={username}\n")
              env_file.write(f"KUDU_PASSWORD={password}\n")

          print("Azure Kudu deployment credentials loaded.")
          PY

      - name: Deploy clean ZIP through Azure Kudu
        shell: bash
        run: |
          set -euo pipefail

          : "${KUDU_USERNAME:?KUDU_USERNAME is unavailable}"
          : "${KUDU_PASSWORD:?KUDU_PASSWORD is unavailable}"

          KUDU_HOST="hiaaexecutivereport-v2-bqcmdycyg7gthyf5.scm.canadaeast-01.azurewebsites.net"
          KUDU_URL="https://${KUDU_HOST}/api/publish?type=zip&clean=true&restart=true&ignorestack=true"

          echo "Deploying tested ZIP through Azure Kudu"
          echo "Kudu host: ${KUDU_HOST}"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 900 \
              --output kudu-response.txt \
              --write-out "%{http_code}" \
              --user "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
              --header "Content-Type: application/zip" \
              --request POST \
              --data-binary "@artifact/node-app.zip" \
              "${KUDU_URL}"
          )"

          echo "Kudu response:"
          cat kudu-response.txt || true
          echo
          echo "Kudu HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || \
             [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "ERROR: Azure deployment failed."
            exit 1
          fi

          echo "Azure deployment completed successfully."

      - name: Verify application startup
        shell: bash
        run: |
          set -euo pipefail

          APP_URL="https://hiaaexecutivereport-v2-bqcmdycyg7gthyf5.canadaeast-01.azurewebsites.net"
          HEALTH_URL="${APP_URL}/api/health"

          echo "Waiting for the application to start..."
          echo "Testing: ${HEALTH_URL}"

          for attempt in $(seq 1 24); do
            RESPONSE_FILE="$(mktemp)"

            STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --output "${RESPONSE_FILE}" \
                --write-out "%{http_code}" \
                "${HEALTH_URL}" || true
            )"

            if [ -z "${STATUS}" ]; then
              STATUS="000"
            fi

            echo "Attempt ${attempt}: HTTP ${STATUS}"

            case "${STATUS}" in
              200|201|202|204)
                echo "Application started successfully."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              301|302|303|307|308)
                echo "Application is running and returned a redirect."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              401|403)
                echo "Application is running."
                echo "The GitHub runner was blocked by authentication or Azure access restrictions."
                echo "Startup verification will be treated as successful."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              404)
                echo "The /api/health route was not found."
                echo "Testing the application root instead."

                ROOT_STATUS="$(
                  curl \
                    --silent \
                    --show-error \
                    --location \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --output "${RESPONSE_FILE}" \
                    --write-out "%{http_code}" \
                    "${APP_URL}/" || true
                )"

                if [ -z "${ROOT_STATUS}" ]; then
                  ROOT_STATUS="000"
                fi

                echo "Root response: HTTP ${ROOT_STATUS}"

                case "${ROOT_STATUS}" in
                  200|201|202|204|301|302|303|307|308|401|403)
                    echo "Application root is reachable."
                    cat "${RESPONSE_FILE}" || true
                    rm -f "${RESPONSE_FILE}"
                    exit 0
                    ;;
                esac
                ;;

              000|502|503|504)
                echo "Application is still starting or temporarily unavailable."
                ;;

              *)
                echo "Application returned HTTP ${STATUS}."
                cat "${RESPONSE_FILE}" || true
                ;;
            esac

            rm -f "${RESPONSE_FILE}"

            if [ "${attempt}" -lt 24 ]; then
              sleep 15
            fi
          done

          echo "ERROR: Application did not become reachable."
          exit 1
