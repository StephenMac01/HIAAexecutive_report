Why the old verification step must be removed
With WEBSITE_RUN_FROM_PACKAGE=1, /home/site/wwwroot becomes a mounted read-only package. The deployment ZIP is stored in /home/data/SitePackages, not deployed as ordinary mutable files. Therefore, a Kudu verification step that expects normal extracted files or tries to detect server-side file changes is no longer the right test. 

Confirm run-from-package is actually active
