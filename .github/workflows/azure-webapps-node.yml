name: Build and deploy CNS HIAA Dashboard to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hiaaexecutivereport-v2
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.16.0"

permissions:
  contents: read

jobs:
  build:
    name: Build deployment package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show runtime versions
        shell: bash
        run: |
          set -euxo pipefail

          node --version
          pnpm --version

      - name: Install application dependencies
        shell: bash
        run: |
          set -euxo pipefail

          pnpm install --frozen-lockfile

      - name: Build Next.js application
        shell: bash
        run: |
          set -euxo pipefail

          pnpm build

      - name: Prepare standalone Azure application
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf deploy node-app.zip
          mkdir -p deploy

          echo "Copying Next.js standalone output"
          cp -a .next/standalone/. deploy/

          echo "Copying Next.js static assets"
          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            echo "Copying public assets"
            cp -a public deploy/public
          fi

          echo "Copying package metadata"
          cp package.json deploy/package.json
          cp pnpm-lock.yaml deploy/pnpm-lock.yaml

          if [ -f pnpm-workspace.yaml ]; then
            cp pnpm-workspace.yaml deploy/pnpm-workspace.yaml
          fi

          if [ -f .npmrc ]; then
            cp .npmrc deploy/.npmrc
          fi

          echo "Installing hoisted production dependency tree"

          pnpm install \
            --dir deploy \
            --prod \
            --frozen-lockfile \
            --ignore-scripts \
            --config.node-linker=hoisted

          echo "Removing stale Azure Oryx files"

          rm -f deploy/oryx-manifest.toml
          rm -f deploy/node_modules.tar.gz
          rm -rf deploy/__oryx_packages__
          rm -rf deploy/_del_node_modules

          echo "Verifying deployment files"

          test -f deploy/server.js
          test -f deploy/package.json
          test -f deploy/node_modules/next/package.json
          test -f deploy/node_modules/@next/env/package.json
          test -f deploy/node_modules/@swc/helpers/package.json
          test -f deploy/node_modules/pg/package.json

          echo "Testing production dependency loading"

          (
            cd deploy

            node -e "require('next'); console.log('next loaded successfully')"
            node -e "require('@next/env'); console.log('@next/env loaded successfully')"
            node -e "require('@swc/helpers/_/_interop_require_default'); console.log('@swc/helpers loaded successfully')"
            node -e "require('pg'); console.log('pg loaded successfully')"
          )

          echo "Creating Azure deployment archive"

          (
            cd deploy
            zip -qr ../node-app.zip .
          )

          echo "Verifying deployment archive"

          test -f node-app.zip

          unzip -l node-app.zip | grep "server.js"
          unzip -l node-app.zip | grep "node_modules/next/package.json"
          unzip -l node-app.zip | grep "node_modules/@next/env/package.json"
          unzip -l node-app.zip | grep "node_modules/@swc/helpers/package.json"
          unzip -l node-app.zip | grep "node_modules/pg/package.json"

          if unzip -l node-app.zip | grep -q "oryx-manifest.toml"; then
            echo "ERROR: Oryx manifest unexpectedly included"
            exit 1
          fi

          if unzip -l node-app.zip | grep -q "node_modules.tar.gz"; then
            echo "ERROR: Oryx node_modules archive unexpectedly included"
            exit 1
          fi

          echo "Deployment archive is ready"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: none

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifact

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euxo pipefail

          test -f artifact/node-app.zip

          unzip -l artifact/node-app.zip | grep "server.js"
          unzip -l artifact/node-app.zip | grep "node_modules/next/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/@next/env/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/@swc/helpers/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/pg/package.json"

          if unzip -l artifact/node-app.zip | grep -q "oryx-manifest.toml"; then
            echo "ERROR: Oryx manifest unexpectedly included"
            exit 1
          fi

          if unzip -l artifact/node-app.zip | grep -q "node_modules.tar.gz"; then
            echo "ERROR: Oryx node_modules archive unexpectedly included"
            exit 1
          fi

      - name: Read Azure publish-profile credentials
        shell: bash
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          profile_xml = os.environ.get("AZURE_PUBLISH_PROFILE", "").strip()

          if not profile_xml:
              raise SystemExit(
                  "AZURE_WEBAPP_PUBLISH_PROFILE is empty or unavailable."
              )

          root = ET.fromstring(profile_xml)
          profiles = root.findall(".//publishProfile")

          if not profiles:
              raise SystemExit(
                  "No publishProfile entries were found in the Azure publish profile."
              )

          selected = None

          for profile in profiles:
              method = profile.attrib.get("publishMethod", "").lower()

              if method in {"zipdeploy", "msdeploy"}:
                  selected = profile
                  break

          if selected is None:
              selected = profiles[0]

          username = selected.attrib.get("userName", "")
          password = selected.attrib.get("userPWD", "")

          if not username or not password:
              raise SystemExit(
                  "The Azure publish profile does not contain deployment credentials."
              )

          github_env = os.environ["GITHUB_ENV"]

          with open(github_env, "a", encoding="utf-8") as env_file:
              env_file.write(f"KUDU_USERNAME={username}\n")
              env_file.write(f"KUDU_PASSWORD={password}\n")

          print("Azure Kudu deployment credentials loaded.")
          PY

      - name: Deploy clean ZIP through Azure Kudu
        shell: bash
        env:
          KUDU_USERNAME: ${{ env.KUDU_USERNAME }}
          KUDU_PASSWORD: ${{ env.KUDU_PASSWORD }}
        run: |
          set -euo pipefail

          KUDU_URL="https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net/api/publish?type=zip&clean=true&restart=true&ignorestack=true"

          echo "Deploying tested ZIP package directly through Kudu"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --output kudu-response.txt \
            --write-out "%{http_code}" \
            --user "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
            --header "Content-Type: application/zip" \
            --request POST \
            --data-binary "@artifact/node-app.zip" \
            "${KUDU_URL}")

          echo "Kudu response:"
          cat kudu-response.txt || true
          echo
          echo "Kudu HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "ERROR: Azure deployment failed."
            exit 1
          fi

          echo "Azure deployment completed successfully."
