Worked for 17s
We now have definitive proof of the failure:

Azure is still transforming the deployment into an Oryx-style node_modules.tar.gz, then starting from that incomplete archive. The application crashes before it can listen on the web port, so Azure returns 503.

Also, one GitHub screenshot shows the health check still using the old generic hostname:

That particular run was using an older workflow revision. The latest textual output uses the correct regional hostname.

The clean fix: run directly from the ZIP
In Azure Portal, go to:

Add:

Keep:

Delete this setting entirely:

Do not merely hide or leave its prior value. Delete the row, apply the settings, and restart the application.

With WEBSITE_RUN_FROM_PACKAGE=1, Azure mounts the uploaded ZIP directly as /home/site/wwwroot rather than extracting and modifying its contents. Microsoft specifically recommends this for prebuilt ZIP applications and notes that it prevents partial or inconsistent deployments. 

Important limitation
Running from package makes /home/site/wwwroot read-only. Your application must not write runtime data, uploaded files, caches, or generated files inside the project directory. Use /home/data, external storage, or your database instead. 

Your existing data directory may need review if the application writes into it.

Then clean the old deployment
Stop the App Service first.

Open Azure SSH and run:

cd /home/site/wwwroot

rm -rf .next
rm -rf node_modules
rm -rf _del_node_modules
rm -rf __oryx_packages__

rm -f node_modules.tar.gz
rm -f oryx-manifest.toml
rm -f server.js
rm -f app-server.js
rm -f package.json
rm -f standalone-response.txt
rm -f standalone-test.log

ls -la
Then:

Apply WEBSITE_RUN_FROM_PACKAGE=1.

Restart the App Service.

Run a new GitHub workflow from main, rather than rerunning an older workflow execution.

What success should look like
After deployment, /home/site/wwwroot will be mounted from the ZIP and may appear read-only. You should no longer see Azure creating:

The startup logs should no longer contain:

Instead, node server.js should load dependencies directly from the ZIP-mounted node_modules.

Why the current deployment fails despite green build checks
The GitHub artifact contains the dependencies—the workflow verifies node_modules/next/package.json. But the deployment process subsequently replaces that directory with:

and creates an incomplete compressed dependency archive. Your screenshots prove that this transformation occurs after the build artifact is produced.

WEBSITE_RUN_FROM_PACKAGE=1 removes that extraction/transformation stage: Azure stores the ZIP under /home/data/SitePackages and mounts it directly as the application root. 


image(260).png
The job is failing in the deployment verification step, and the logs point to Azure Oryx build-on-deploy still running on the App Service, which is modifying the uploaded ZIP after your workflow already produced a valid standalone Next.js bundle.

What the logs show
