Then it checks the live server via Kudu and fails if it finds oryx-manifest.toml or missing runtime files.
Root cause
Azure App Service is likely rebuilding the app during deployment, even though the workflow is already deploying a prebuilt standalone app.

The workflow comments already identify the fix:

SCM_DO_BUILD_DURING_DEPLOYMENT = false
ENABLE_ORYX_BUILD = false
