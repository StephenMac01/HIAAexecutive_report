name: Build and deploy CNS HIAA Dashboard to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hiaaexecutivereport-v2
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.16.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build
      - name: Prepare standalone application
        run: |
          rm -rf deploy node-app.zip
          mkdir -p deploy

          cp -a .next/standalone/. deploy/

          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            cp -a public deploy/public
          fi

          echo "Locating SWC helpers"

          SWC_HELPER_FILE="$(node -p "require.resolve('@swc/helpers/esm/_interop_require_default.js')")"
          SWC_HELPERS_DIR="$(dirname "$(dirname "$SWC_HELPER_FILE")")"

          echo "SWC helper file: $SWC_HELPER_FILE"
          echo "SWC helpers directory: $SWC_HELPERS_DIR"

          mkdir -p deploy/node_modules/@swc
          cp -aL "$SWC_HELPERS_DIR" deploy/node_modules/@swc/helpers

          echo "Checking standalone package"

          for file in \
            deploy/server.js \
            deploy/node_modules/next/package.json \
            deploy/node_modules/react/package.json \
            deploy/node_modules/react-dom/package.json \
            deploy/node_modules/@swc/helpers/package.json \
            deploy/node_modules/@swc/helpers/esm/_interop_require_default.js
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

          cd deploy
          zip -r ../node-app.zip .
          cd ..

          echo "Checking ZIP package"

          unzip -l node-app.zip | grep "server.js"
          unzip -l node-app.zip | grep "node_modules/next/package.json"
          unzip -l node-app.zip | grep "node_modules/@swc/helpers/esm/_interop_require_default.js"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: none

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifact

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifact/node-app.zip
