name: Build and deploy CNS HIAA Dashboard to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hiaaexecutivereport-v2
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.16.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build

      - name: Prepare standalone application
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf deploy node-app.zip
          mkdir -p deploy

          echo "Copying Next.js standalone output"
          cp -a .next/standalone/. deploy/

          echo "Copying static assets"
          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            echo "Copying public assets"
            cp -a public deploy/public
          fi

          echo "Defining pnpm package copy helper"

          copy_pnpm_package() {
            PACKAGE_NAME="$1"
            DESTINATION="deploy/node_modules/$PACKAGE_NAME"

            PACKAGE_JSON=""

            if [ -f "node_modules/$PACKAGE_NAME/package.json" ]; then
              PACKAGE_JSON="node_modules/$PACKAGE_NAME/package.json"
            else
              PACKAGE_JSON=$(find node_modules/.pnpm \
                -path "*/node_modules/$PACKAGE_NAME/package.json" \
                -print \
                -quit)
            fi

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERROR: Could not locate package: $PACKAGE_NAME"
              exit 1
            fi

            PACKAGE_DIR=$(dirname "$PACKAGE_JSON")

            echo "Copying $PACKAGE_NAME"
            echo "Source: $PACKAGE_DIR"
            echo "Destination: $DESTINATION"

            rm -rf "$DESTINATION"
            mkdir -p "$(dirname "$DESTINATION")"
            cp -aL "$PACKAGE_DIR" "$DESTINATION"
          }

          echo "Copying SWC helpers"
          copy_pnpm_package "@swc/helpers"

          echo "Copying Next.js environment package"
          copy_pnpm_package "@next/env"

          echo "Copying PostgreSQL runtime packages"

          POSTGRES_PACKAGES=(
            "pg"
            "pg-connection-string"
            "pg-pool"
            "pg-protocol"
            "pg-types"
            "pgpass"
            "pg-int8"
            "postgres-array"
            "postgres-bytea"
            "postgres-date"
            "postgres-interval"
            "split2"
          )

          for PACKAGE_NAME in "${POSTGRES_PACKAGES[@]}"; do
            copy_pnpm_package "$PACKAGE_NAME"
          done

          echo "Verifying required runtime files"

          REQUIRED_FILES=(
            "deploy/server.js"
            "deploy/node_modules/next/package.json"
            "deploy/node_modules/@swc/helpers/package.json"
            "deploy/node_modules/@swc/helpers/esm/_interop_require_default.js"
            "deploy/node_modules/@next/env/package.json"
            "deploy/node_modules/pg/package.json"
            "deploy/node_modules/pg-types/package.json"
            "deploy/node_modules/pg-protocol/package.json"
            "deploy/node_modules/pg-pool/package.json"
            "deploy/node_modules/pgpass/package.json"
            "deploy/node_modules/pg-int8/package.json"
            "deploy/node_modules/postgres-array/package.json"
            "deploy/node_modules/postgres-bytea/package.json"
            "deploy/node_modules/postgres-date/package.json"
            "deploy/node_modules/postgres-interval/package.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
              exit 1
            fi
          done

          echo "Testing dependency resolution from deployment directory"

          (
            cd deploy

            node -e "require.resolve('next')"
            node -e "require.resolve('@swc/helpers/esm/_interop_require_default.js')"
            node -e "require.resolve('@next/env')"
            node -e "require.resolve('pg')"
            node -e "require.resolve('pg-types')"
            node -e "require.resolve('pg-protocol')"
            node -e "require.resolve('pg-pool')"
            node -e "require.resolve('pgpass')"
            node -e "require.resolve('postgres-array')"
          )

          echo "Creating deployment archive"

          (
            cd deploy
            zip -qr ../node-app.zip .
          )

          echo "Deployment archive created"

          test -f node-app.zip
          unzip -l node-app.zip | grep "server.js"
          unzip -l node-app.zip | grep "node_modules/next/package.json"
          unzip -l node-app.zip | grep "node_modules/@swc/helpers/esm/_interop_require_default.js"
          unzip -l node-app.zip | grep "node_modules/@next/env/package.json"
          unzip -l node-app.zip | grep "node_modules/pg/package.json"
          unzip -l node-app.zip | grep "node_modules/pg-types/package.json"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: none

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifact

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euxo pipefail

          test -f artifact/node-app.zip

          unzip -l artifact/node-app.zip | grep "server.js"
          unzip -l artifact/node-app.zip | grep "node_modules/next/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/@swc/helpers/esm/_interop_require_default.js"
          unzip -l artifact/node-app.zip | grep "node_modules/@next/env/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/pg/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/pg-types/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/pg-protocol/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/pg-pool/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/pgpass/package.json"
          unzip -l artifact/node-app.zip | grep "node_modules/postgres-array/package.json"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifact/node-app.zip
