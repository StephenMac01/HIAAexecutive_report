Application settings
SCM_DO_BUILD_DURING_DEPLOYMENT = false
ENABLE_ORYX_BUILD = false
General settings
Startup Command: node server.js
Why this fixes it
Your ZIP is already prepared as a complete standalone deployment. If Azure runs Oryx again, it can:

create oryx-manifest.toml
rewrite node_modules
drop or alter needed packages like next or @swc/helpers
That is why the workflow detects the server-side bundle as broken.

