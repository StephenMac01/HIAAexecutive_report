That is already being injected into deploy/package.json by the workflow, so the main fix is still the Azure App Service configuration.

Bottom line
This is not a build artifact problem in GitHub Actions. The artifact is being prepared correctly. The failure is caused by Azure redeploying/rebuilding it with Oryx. Disable Oryx build during deployment, set the startup command to node server.js, and redeploy.   I have done this multiple times .. what is the new answer

