      - name: Verify application startup
        shell: bash
        run: |
          set -euo pipefail

          APP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          HEALTH_URL="${APP_URL}/api/health"

          echo "Waiting for the application to start..."
          echo "Health endpoint: ${HEALTH_URL}"

          for attempt in $(seq 1 30); do
            RESPONSE_FILE="$(mktemp)"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --output "${RESPONSE_FILE}" \
                --write-out "%{http_code}" \
                "${HEALTH_URL}" || true
            )"

            echo "Attempt ${attempt}: HTTP ${HTTP_CODE}"

            case "${HTTP_CODE}" in
              200|204)
                echo "Application started successfully."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              301|302|307|308)
                echo "Application is running and returned a redirect."
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              401|403)
                echo "Application is running, but the GitHub runner is blocked by authentication or Azure access restrictions."
                echo "Treating this as a successful startup verification."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              000|502|503|504)
                echo "Application is still starting or temporarily unavailable."
                ;;

              *)
                echo "Application returned HTTP ${HTTP_CODE}."
                cat "${RESPONSE_FILE}" || true
                ;;
            esac

            rm -f "${RESPONSE_FILE}"
            sleep 15
          done

          echo "ERROR: Application did not become reachable after 30 attempts."

          echo "Collecting Azure application information..."
          az webapp show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "{state:state,hostName:defaultHostName,enabled:enabled}" \
            --output table || true

          echo "Recent application logs:"
          az webapp log tail \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --timeout 60 || true

          exit 1    here is the Yaml ...    please fix ... .

