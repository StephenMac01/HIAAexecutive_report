name: Build and deploy CNS HIAA Dashboard to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hiaaexecutivereport-v2
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.16.0"
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: hiaaexecutivereport-v2-production
  cancel-in-progress: true

jobs:
  build:
    name: Build deployment package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show runtime versions
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile

      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .next deploy node-app.zip

      - name: Build Next.js application
        shell: bash
        run: |
          set -euxo pipefail
          pnpm build

      - name: Verify standalone output
        shell: bash
        run: |
          set -euxo pipefail
          test -d .next/standalone
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/server
          test -d .next/server
          test -d .next/server/chunks
          test -d .next/static
          test -f .next/BUILD_ID
          echo "Standalone Next.js output verified."

      - name: Prepare Azure deployment package
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf deploy node-app.zip
          mkdir -p deploy

          echo "Copying standalone application"
          cp -a .next/standalone/. deploy/

          echo "Copying complete Next.js server output"
          rm -rf deploy/.next/server
          mkdir -p deploy/.next
          cp -a .next/server deploy/.next/server

          echo "Copying Next.js static assets"
          rm -rf deploy/.next/static
          cp -a .next/static deploy/.next/static

          echo "Copying Next.js build metadata"
          cp -a .next/BUILD_ID deploy/.next/BUILD_ID

          for file in \
            app-build-manifest.json \
            build-manifest.json \
            fallback-build-manifest.json \
            prerender-manifest.json \
            react-loadable-manifest.json \
            required-server-files.json \
            routes-manifest.json
          do
            if [ -f ".next/${file}" ]; then
              cp -a ".next/${file}" "deploy/.next/${file}"
            fi
          done

          if [ -d public ]; then
            echo "Copying public assets"
            rm -rf deploy/public
            cp -a public deploy/public
          fi

          if [ -d data ]; then
            echo "Copying local KPI fallback data"
            rm -rf deploy/data
            cp -a data deploy/data
          fi

          echo "Healing standalone node_modules with complete runtime packages"
          for mod in @swc/helpers styled-jsx tslib scheduler client-only; do
            src="node_modules/${mod}"
            if [ ! -f "${src}/package.json" ]; then
              echo "ERROR: runtime dependency '${mod}' not found at ${src}."
              echo "Confirm .npmrc has 'node-linker=hoisted' and that pnpm install ran."
              exit 1
            fi
            mkdir -p "deploy/node_modules/$(dirname "${mod}")"
            rm -rf "deploy/node_modules/${mod}"
            cp -aL "${src}" "deploy/node_modules/${mod}"
            echo "  healed: ${mod}"
          done

          echo "Overlaying PostgreSQL runtime dependency tree"
          for mod in \
            pg \
            pg-types \
            pg-int8 \
            pg-numeric \
            pg-protocol \
            pg-pool \
            pg-connection-string \
            pgpass \
            postgres-array \
            postgres-bytea \
            postgres-date \
            postgres-interval \
            postgres-range \
            obuf
          do
            src="node_modules/${mod}"
            if [ -f "${src}/package.json" ]; then
              mkdir -p "deploy/node_modules/$(dirname "${mod}")"
              rm -rf "deploy/node_modules/${mod}"
              cp -aL "${src}" "deploy/node_modules/${mod}"
              echo "  copied: ${mod}"
            else
              echo "WARNING: optional runtime dependency '${mod}' not found at ${src}; skipping."
            fi
          done

          echo "Verifying healed runtime files"
          test -f deploy/node_modules/@swc/helpers/esm/_interop_require_default.js
          test -f deploy/node_modules/@swc/helpers/package.json
          test -f deploy/node_modules/styled-jsx/package.json
          test -f deploy/node_modules/tslib/package.json
          test -f deploy/node_modules/scheduler/package.json
          test -f deploy/node_modules/client-only/package.json
          test -f deploy/node_modules/next/package.json
          test -f deploy/node_modules/pg/package.json

          echo "Removing stale Azure Oryx files"
          rm -f deploy/oryx-manifest.toml
          rm -f deploy/node_modules.tar.gz
          rm -rf deploy/__oryx_packages__
          rm -rf deploy/_del_node_modules

          echo "Applying Azure 0.0.0.0 bind wrapper"
          mv deploy/server.js deploy/app-server.js
          cat > deploy/server.js <<'NODE'
          process.env.HOSTNAME = "0.0.0.0"
          if (!process.env.PORT) {
            process.env.PORT = "8080"
          }
          require("./app-server.js")
          NODE

          echo "Ensuring an npm start script points at the wrapper"
          node -e "const fs=require('fs');const f='deploy/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.scripts={...(p.scripts||{}),start:'node server.js'};fs.writeFileSync(f,JSON.stringify(p,null,2));console.log('start script set to: node server.js')"

          echo "Verifying deployment package"
          test -f deploy/server.js
          test -f deploy/app-server.js
          test -f deploy/.next/BUILD_ID
          test -d deploy/.next/server
          test -d deploy/.next/server/chunks
          test -d deploy/.next/server/chunks/ssr
          test -d deploy/.next/static
          test -f deploy/.next/server/app/_not-found/page.js
          test -f deploy/.next/server/app/_global-error/page.js
          test -f deploy/node_modules/next/package.json
          test -f deploy/node_modules/pg/package.json

          echo "Confirming server.js is the Azure bind wrapper"
          grep -Fq 'process.env.HOSTNAME = "0.0.0.0"' deploy/server.js

          echo "Testing production dependencies"
          (
            cd deploy
            node -e "require('next'); console.log('next loaded successfully')"
            node -e "require('pg'); console.log('pg loaded successfully')"
          )

          echo "Testing standalone Next.js server (via the Azure wrapper)"
          (
            cd deploy

            HOSTNAME="bogus-azure-container-host" PORT=8081 node server.js \
              >standalone-test.log 2>&1 &

            SERVER_PID="$!"

            cleanup() {
              kill "${SERVER_PID}" 2>/dev/null || true
            }

            trap cleanup EXIT

            for attempt in $(seq 1 20); do
              STATUS="$(
                curl \
                  --silent \
                  --output standalone-response.txt \
                  --write-out "%{http_code}" \
                  "http://127.0.0.1:8081/" || true
              )"

              if [ -z "${STATUS}" ]; then
                STATUS="000"
              fi

              echo "Standalone test attempt ${attempt}: HTTP ${STATUS}"

              if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 500 ]; then
                echo "Standalone server responded successfully on 0.0.0.0."
                exit 0
              fi

              sleep 1
            done

            echo "ERROR: Standalone server did not respond."
            cat standalone-test.log || true
            exit 1
          )

          echo "Removing test artifacts from the package"
          rm -f deploy/standalone-test.log deploy/standalone-response.txt

          echo "Creating Azure deployment archive"
          (
            cd deploy
            zip -qr ../node-app.zip .
          )

          echo "Verifying deployment archive"
          test -f node-app.zip

          unzip -Z1 node-app.zip | grep -Fx "server.js"
          unzip -Z1 node-app.zip | grep -Fx "app-server.js"
          unzip -Z1 node-app.zip | grep -Fx ".next/BUILD_ID"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/next/package.json"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/pg/package.json"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/@swc/helpers/esm/_interop_require_default.js"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/tslib/package.json"
          unzip -Z1 node-app.zip | grep -Fx "node_modules/scheduler/package.json"

          if unzip -Z1 node-app.zip | grep -q "^oryx-manifest.toml$"; then
            echo "ERROR: Oryx manifest unexpectedly included."
            exit 1
          fi

          if unzip -Z1 node-app.zip | grep -q "^node_modules.tar.gz$"; then
            echo "ERROR: Oryx node_modules archive unexpectedly included."
            exit 1
          fi

          echo "Deployment archive is complete."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifact

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euxo pipefail

          test -f artifact/node-app.zip

          unzip -Z1 artifact/node-app.zip | grep -Fx "server.js"
          unzip -Z1 artifact/node-app.zip | grep -Fx "app-server.js"
          unzip -Z1 artifact/node-app.zip | grep -Fx ".next/BUILD_ID"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/next/package.json"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/pg/package.json"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/@swc/helpers/esm/_interop_require_default.js"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/tslib/package.json"
          unzip -Z1 artifact/node-app.zip | grep -Fx "node_modules/scheduler/package.json"

          if unzip -Z1 artifact/node-app.zip | grep -q "^oryx-manifest.toml$"; then
            echo "ERROR: Oryx manifest unexpectedly included."
            exit 1
          fi

          if unzip -Z1 artifact/node-app.zip | grep -q "^node_modules.tar.gz$"; then
            echo "ERROR: Oryx node_modules archive unexpectedly included."
            exit 1
          fi

          echo "Downloaded deployment archive verified."

      - name: Read Azure publish-profile credentials
        shell: bash
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          profile_xml = os.environ.get("AZURE_PUBLISH_PROFILE", "").strip()

          if not profile_xml:
              raise SystemExit(
                  "AZURE_WEBAPP_PUBLISH_PROFILE is empty or unavailable."
              )

          try:
              root = ET.fromstring(profile_xml)
          except ET.ParseError as error:
              raise SystemExit(
                  f"AZURE_WEBAPP_PUBLISH_PROFILE is not valid XML: {error}"
              ) from error

          profiles = root.findall(".//publishProfile")

          if not profiles:
              raise SystemExit("No publishProfile entries were found.")

          selected = None

          for profile in profiles:
              method = profile.attrib.get("publishMethod", "").lower()
              if method in {"zipdeploy", "msdeploy"}:
                  selected = profile
                  break

          if selected is None:
              selected = profiles[0]

          username = selected.attrib.get("userName", "")
          password = selected.attrib.get("userPWD", "")

          if not username or not password:
              raise SystemExit(
                  "The publish profile does not contain deployment credentials."
              )

          publish_url = selected.attrib.get("publishUrl", "").strip()

          if "://" in publish_url:
              publish_url = publish_url.split("://", 1)[1]

          publish_url = publish_url.split("/", 1)[0]
          kudu_host = publish_url.split(":", 1)[0]

          if not kudu_host:
              raise SystemExit(
                  "The publish profile does not contain a publishUrl (Kudu host)."
              )

          github_env = os.environ["GITHUB_ENV"]

          with open(github_env, "a", encoding="utf-8") as env_file:
              env_file.write(f"KUDU_USERNAME={username}\n")
              env_file.write(f"KUDU_PASSWORD={password}\n")
              env_file.write(f"KUDU_HOST={kudu_host}\n")

          print(
              f"Azure Kudu deployment credentials loaded. Kudu host: {kudu_host}"
          )
          PY

      - name: Deploy clean ZIP through Azure Kudu
        shell: bash
        run: |
          set -euo pipefail

          : "${KUDU_USERNAME:?KUDU_USERNAME is unavailable}"
          : "${KUDU_PASSWORD:?KUDU_PASSWORD is unavailable}"

          KUDU_HOST="${KUDU_HOST:-${AZURE_WEBAPP_NAME}.scm.azurewebsites.net}"
          KUDU_BASE="https://${KUDU_HOST}"
          KUDU_URL="${KUDU_BASE}/api/zipdeploy?isAsync=true"
          ZIP_FILE="artifact/node-app.zip"

          echo "Deploying tested ZIP asynchronously through Azure Kudu"
          echo "Kudu host: ${KUDU_HOST}"
          echo "ZIP: ${ZIP_FILE}"

          if [ ! -f "${ZIP_FILE}" ]; then
            echo "ERROR: Deployment ZIP does not exist: ${ZIP_FILE}"
            exit 1
          fi

          echo "ZIP size:"
          ls -lh "${ZIP_FILE}"

          if ! getent hosts "${KUDU_HOST}" >/dev/null 2>&1 \
             && ! nslookup "${KUDU_HOST}" >/dev/null 2>&1; then
            echo "ERROR: Could not resolve Kudu host '${KUDU_HOST}'."
            echo "Verify the Azure publish profile is current."
            exit 1
          fi

          rm -f kudu-headers.txt kudu-response.txt deployment-status.json

          echo "Starting asynchronous ZIP deployment..."

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 30 \
              --max-time 120 \
              --dump-header kudu-headers.txt \
              --output kudu-response.txt \
              --write-out "%{http_code}" \
              --user "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
              --header "Content-Type: application/zip" \
              --request POST \
              --data-binary "@${ZIP_FILE}" \
              "${KUDU_URL}"
          )"

          echo "Initial Kudu HTTP status: ${HTTP_STATUS}"

          if [ -s kudu-response.txt ]; then
            echo "Initial Kudu response:"
            cat kudu-response.txt
            echo
          fi

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "ERROR: Kudu rejected the ZIP deployment request."
            exit 1
          fi

          DEPLOYMENT_URL="$(
            awk '
              BEGIN { IGNORECASE=1 }
              /^Location:/ {
                sub(/\r$/, "", $2)
                print $2
              }
            ' kudu-headers.txt | tail -1
          )"

          if [ -z "${DEPLOYMENT_URL}" ]; then
            echo "ERROR: Kudu did not return a Location header."
            echo "--- Response headers ---"
            cat kudu-headers.txt
            exit 1
          fi

          case "${DEPLOYMENT_URL}" in
            http://*|https://*)
              ;;
            /*)
              DEPLOYMENT_URL="${KUDU_BASE}${DEPLOYMENT_URL}"
              ;;
            *)
              DEPLOYMENT_URL="${KUDU_BASE}/${DEPLOYMENT_URL}"
              ;;
          esac

          echo "Deployment status URL: ${DEPLOYMENT_URL}"

          MAX_ATTEMPTS=120
          ATTEMPT=1

          while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do
            echo "Checking deployment status (${ATTEMPT}/${MAX_ATTEMPTS})..."

            POLL_HTTP="$(
              curl \
                --silent \
                --show-error \
                --connect-timeout 30 \
                --max-time 60 \
                --output deployment-status.json \
                --write-out "%{http_code}" \
                --user "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
                "${DEPLOYMENT_URL}"
            )"

            if [ "${POLL_HTTP}" -lt 200 ] || [ "${POLL_HTTP}" -ge 300 ]; then
              echo "WARNING: Status endpoint returned HTTP ${POLL_HTTP}."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            STATUS="$(jq -r '.status // -1' deployment-status.json)"
            STATUS_TEXT="$(jq -r '.status_text // .message // ""' deployment-status.json)"
            PROGRESS="$(jq -r '.progress // ""' deployment-status.json)"

            echo "Kudu status: ${STATUS}"
            echo "Status text: ${STATUS_TEXT}"

            if [ -n "${PROGRESS}" ]; then
              echo "Progress: ${PROGRESS}"
            fi

            if [ "${STATUS}" = "4" ]; then
              echo "Azure deployment completed successfully."
              exit 0
            fi

            if [ "${STATUS}" = "3" ]; then
              echo "ERROR: Azure deployment failed."
              echo "--- Deployment response ---"
              cat deployment-status.json
              echo "--- Kudu deployment log ---"
              curl \
                --silent \
                --show-error \
                --user "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
                "${DEPLOYMENT_URL}/log" || true
              exit 1
            fi

            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "ERROR: Deployment did not complete within 20 minutes."
          echo "--- Last known deployment status ---"
          cat deployment-status.json || true
          exit 1

      - name: Verify server-side package
        shell: bash
        run: |
          set -euo pipefail

          : "${KUDU_USERNAME:?KUDU_USERNAME is unavailable}"
          : "${KUDU_PASSWORD:?KUDU_PASSWORD is unavailable}"
          KUDU_HOST="${KUDU_HOST:-${AZURE_WEBAPP_NAME}.scm.azurewebsites.net}"

          REMOTE_CMD='echo "--- wwwroot ---"; ls -1 /home/site/wwwroot | head -40; echo "--- checks ---"; test -f /home/site/wwwroot/server.js && echo SERVER_OK || echo SERVER_MISSING; test -f /home/site/wwwroot/node_modules/next/package.json && echo NEXT_OK || echo NEXT_MISSING; test -f /home/site/wwwroot/node_modules/@swc/helpers/package.json && echo SWC_OK || echo SWC_MISSING'

          BODY="$(REMOTE_CMD="${REMOTE_CMD}" python3 -c 'import json,os; print(json.dumps({"command": os.environ["REMOTE_CMD"], "dir": "/home/site/wwwroot"}))')"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 30 \
              --max-time 120 \
              --user "${KUDU_USERNAME}:${KUDU_PASSWORD}" \
              --header "Content-Type: application/json" \
              --request POST \
              --data "${BODY}" \
              "https://${KUDU_HOST}/api/command" || true
          )"

          echo "Server-side wwwroot inspection (raw Kudu response):"
          echo "${RESPONSE}"

          if echo "${RESPONSE}" | grep -qE "NEXT_MISSING|SWC_MISSING|SERVER_MISSING"; then
            echo "ERROR: The deployed bundle is incomplete on the server."
            echo "Expected server.js + node_modules/next + node_modules/@swc/helpers."
            exit 1
          fi

          echo "Server-side bundle verified."

      - name: Verify application startup
        shell: bash
        run: |
          set -euo pipefail

          APP_URL="https://${AZURE_WEBAPP_NAME}.azurewebsites.net"
          HEALTH_URL="${APP_URL}/api/health"

          echo "Waiting for the application to start..."
          echo "Testing: ${HEALTH_URL}"

          for attempt in $(seq 1 24); do
            RESPONSE_FILE="$(mktemp)"

            STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --output "${RESPONSE_FILE}" \
                --write-out "%{http_code}" \
                "${HEALTH_URL}" || true
            )"

            if [ -z "${STATUS}" ]; then
              STATUS="000"
            fi

            echo "Attempt ${attempt}: HTTP ${STATUS}"

            case "${STATUS}" in
              200|201|202|204)
                echo "Application started successfully."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              301|302|303|307|308)
                echo "Application is running and returned a redirect."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              401|403)
                echo "Application is running."
                echo "The GitHub runner was blocked by authentication or Azure access restrictions."
                cat "${RESPONSE_FILE}" || true
                rm -f "${RESPONSE_FILE}"
                exit 0
                ;;

              404)
                echo "The /api/health route was not found."
                echo "Testing the application root instead."

                ROOT_STATUS="$(
                  curl \
                    --silent \
                    --show-error \
                    --location \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --output "${RESPONSE_FILE}" \
                    --write-out "%{http_code}" \
                    "${APP_URL}/" || true
                )"

                if [ -z "${ROOT_STATUS}" ]; then
                  ROOT_STATUS="000"
                fi

                echo "Root response: HTTP ${ROOT_STATUS}"

                case "${ROOT_STATUS}" in
                  200|201|202|204|301|302|303|307|308|401|403)
                    echo "Application root is reachable."
                    cat "${RESPONSE_FILE}" || true
                    rm -f "${RESPONSE_FILE}"
                    exit 0
                    ;;
                esac
                ;;

              000|502|503|504)
                echo "Application is still starting or temporarily unavailable."
                ;;

              *)
                echo "Application returned HTTP ${STATUS}."
                cat "${RESPONSE_FILE}" || true
                ;;
            esac

            rm -f "${RESPONSE_FILE}"

            if [ "${attempt}" -lt 24 ]; then
              sleep 15
            fi
          done

          echo "ERROR: Application did not become reachable."
          exit 1
